apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mainApp.replicaCount }}
  selector:
    matchLabels:
      app: main-app
  template:
    metadata:
      labels:
        app: main-app
        app2: {{ .Values.test }}
    spec:
      containers:
        - name: main-app
          image: "{{ .Values.mainApp.image.repository }}:{{ .Values.mainApp.image.tag }}"
          imagePullPolicy: "{{ .Values.mainApp.image.pullPolicy }}"
