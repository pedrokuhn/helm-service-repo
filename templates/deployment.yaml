apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app
spec:
  replicas: { { .Values.mainApp.replicaCount } }
  selector:
    matchLabels:
      app: main-app
  template:
    metadata:
      labels:
        app: main-app
    spec:
      containers:
        - name: main-app
          image: "{{ .Values.mainApp.image.repository }}:{{ .Values.mainApp.image.tag }}"
          imagePullPolicy: "{{ .Values.mainApp.image.pullPolicy }}"
